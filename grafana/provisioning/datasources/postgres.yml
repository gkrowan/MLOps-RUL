apiVersion: 1

datasources:
  - name: MLOps PostgreSQL
    uid: mlops-postgres
    type: postgres
    access: proxy
    url: postgres:5432
    user: ${POSTGRES_USER}
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    jsonData:
      database: mlflow
      sslmode: disable
      postgresVersion: 1600
    isDefault: true
