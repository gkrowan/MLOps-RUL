name: Test and deploy to OCI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oci-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v6

      - name: Configure SSH
        env:
          OCI_SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          OCI_SSH_KNOWN_HOSTS: ${{ secrets.OCI_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$OCI_SSH_PRIVATE_KEY" > ~/.ssh/id_oci
          chmod 600 ~/.ssh/id_oci
          printf '%s\n' "$OCI_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Create application directory
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_DEPLOY_PATH: ${{ secrets.OCI_DEPLOY_PATH }}
        run: ssh -i ~/.ssh/id_oci "$OCI_USER@$OCI_HOST" "mkdir -p '$OCI_DEPLOY_PATH'"

      - name: Upload tested source
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_DEPLOY_PATH: ${{ secrets.OCI_DEPLOY_PATH }}
        run: |
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='data/' \
            --exclude='artifacts/' \
            --exclude='airflow/logs/' \
            -e 'ssh -i ~/.ssh/id_oci' \
            ./ "$OCI_USER@$OCI_HOST:$OCI_DEPLOY_PATH/"

      - name: Deploy Compose stack
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_DEPLOY_PATH: ${{ secrets.OCI_DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/id_oci "$OCI_USER@$OCI_HOST" \
            "cd '$OCI_DEPLOY_PATH' && test -f .env && docker compose -f docker-compose.yml -f docker-compose.oracle.yml up --build -d && docker compose -f docker-compose.yml -f docker-compose.oracle.yml ps"
